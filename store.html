<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | Purrlight</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <div id="vanta-bg"></div>

    <nav>
        <a href="index.html" class="logo">PURRLIGHT</a>
        <div class="nav-links">
            <a href="store.html">Store</a>
            <button class="cart-btn mock-cart-open">Cart (<span class="snipcart-items-count">0</span>)</button>
        </div>
    </nav>

    <section>
        <h1 class="section-title">The Genesis Collection</h1>
        <div class="collection-grid">
            
            <div class="product-card">
                <div class="product-img-placeholder">[ Hoodie Image ]</div>
                <h3>Neon Threads Hoodie</h3>
                <span class="price">€59.99</span>
                <a href="item-neon-hoodie.html" class="btn-glow" style="padding: 0.8rem 2rem; width: 100%;">View Details</a>
            </div>
            
            <div class="product-card">
                <div class="product-img-placeholder">[ Tee Image ]</div>
                <h3>Cyber Tee</h3>
                <span class="price">€29.99</span>
                <a href="item-cyber-tee.html" class="btn-glow" style="padding: 0.8rem 2rem; width: 100%;">View Details</a>
            </div>
            
            <div class="product-card">
                <div class="product-img-placeholder">[ Cap Image ]</div>
                <h3>Aura Snapback</h3>
                <span class="price">€24.99</span>
                <a href="item-aura-snapback.html" class="btn-glow" style="padding: 0.8rem 2rem; width: 100%;">View Details</a>
            </div>

        </div>
    </section>
</body>
</html>
